{% extends "base.html" %}
{% block title %}{{ _("Error") }} {{ error_status }}{% endblock %}
{% block content %}
<h1>{{ _("Page not found") if error_status == 404 else _("Something went wrong") }}</h1>
<p>{{ _(message, **params) }}</p>
<p><a href="/">{{ _("Back to the start") }}</a></p>
{% endblock %}
